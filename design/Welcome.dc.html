<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #f7f6f3; color: #1c1917; font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #2a78d6; } a:hover { color: #1c5cab; }
    h1, h2, h3, p { text-wrap: pretty; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 1440px; height: 900px; background: #f7f6f3">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 32px; width: 640px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
      <svg width="48" height="48" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#1c1917"></rect><rect x="5" y="11" width="18" height="7" rx="1.5" fill="#3a3530"></rect><path d="M5.5 19.5l5-6 4 3.5 7.5-9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; color: #1c1917">Medical Charts</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #57534e; text-align: center">See how lab results change over time, across every report and lab.</p>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; padding: 52px 40px; background: #ffffff; border: 1.5px dashed #c9c3b8; border-radius: 16px">
      <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 999px; background: #f0eee9"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4.5 15v3.5a1.5 1.5 0 001.5 1.5h12a1.5 1.5 0 001.5-1.5V15" stroke="#1c1917" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      <span style="font-size: 18px; font-weight: 600; color: #1c1917">Drop report files here</span>
      <span style="max-width: 440px; font-size: 14px; line-height: 1.5; color: #57534e; text-align: center">Merged report JSON from the OCR pipeline, one or many at a time. Per-page files are skipped.</span>
      <span style="display: flex; align-items: center; height: 44px; margin-top: 6px; padding: 0 18px; border-radius: 8px; background: #1c1917; color: #ffffff; font-size: 14px; font-weight: 500">Choose files</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #78716c"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6.5" rx="1.5" stroke="#78716c" stroke-width="1.3"></rect><path d="M4.5 6V4.5a2.5 2.5 0 015 0V6" stroke="#78716c" stroke-width="1.3"></path></svg><span>Stays on this computer, in a local SQLite database.</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
